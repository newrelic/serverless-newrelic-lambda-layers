name: Prepare Release PR

# Since we are reusing a workflow, we must match the permissions that
# upstream workflow requires.
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Type of release. patch or minor (major if breaking)
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  release-notes:
    uses: newrelic/node-newrelic/.github/workflows/prep-release.yml@main
    with:
      release_type: ${{ github.event.inputs.release_type }}
      changelog_file: CHANGELOG.md
