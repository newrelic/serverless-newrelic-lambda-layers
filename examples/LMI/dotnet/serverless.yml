service: lmi-dotnet-example
frameworkVersion: '4'

provider:
  name: aws
  runtime: dotnet8
  region: ${opt:region, env:AWS_REGION}
  stage: ${opt:stage, 'dev'}
  architecture: x86_64

plugins:
  - serverless-newrelic-lambda-layers

custom:
  newRelic:
    accountId: ${env:NEW_RELIC_ACCOUNT_ID}
    apiKey: ${env:NEW_RELIC_LICENSE_KEY}

  capacityProvider:
    name: ${opt:capacityProviderName, 'lmi-example-cp'}
    operatorRoleArn: ${env:CAPACITY_PROVIDER_OPERATOR_ROLE_ARN}
    subnetIds: ${split(',', env:CAPACITY_PROVIDER_SUBNET_IDS)}
    securityGroupIds: ${split(',', env:CAPACITY_PROVIDER_SECURITY_GROUP_IDS)}
    maxVCpuCount: ${env:CAPACITY_PROVIDER_MAX_VCPU_COUNT, 48}
    perExecutionEnvironmentMaxConcurrency: ${env:CAPACITY_PROVIDER_PER_ENV_MAX_CONCURRENCY, 8}

functions:
  app:
    handler: LmiTest::LmiTest.Function::FunctionHandler
    timeout: 30
    memorySize: 2048
    environment:
      NEW_RELIC_ACCOUNT_ID: ${env:NEW_RELIC_ACCOUNT_ID}
      NEW_RELIC_LICENSE_KEY: ${env:NEW_RELIC_LICENSE_KEY}
      CORECLR_ENABLE_PROFILING: '1'
      CORECLR_PROFILER: '{36032161-FFC0-4B61-B559-F6C5D41BAE5A}'
      CORECLR_NEWRELIC_HOME: /opt/lib/newrelic-dotnet-agent
      CORECLR_PROFILER_PATH: /opt/lib/newrelic-dotnet-agent/libNewRelicProfiler.so
      NEW_RELIC_APM_LAMBDA_MODE: 'true'
      NEW_RELIC_EXTENSION_SEND_LOGS: 'function,platform'

resources:
  Resources:
    LmiCapacityProvider:
      Type: AWS::Lambda::CapacityProvider
      Properties:
        CapacityProviderName: ${self:custom.capacityProvider.name}
        PermissionsConfig:
          CapacityProviderOperatorRoleArn: ${self:custom.capacityProvider.operatorRoleArn}
        VpcConfig:
          SubnetIds: ${self:custom.capacityProvider.subnetIds}
          SecurityGroupIds: ${self:custom.capacityProvider.securityGroupIds}
        InstanceRequirements:
          Architectures:
            - x86_64
        CapacityProviderScalingConfig:
          ScalingMode: Auto
          MaxVCpuCount: ${self:custom.capacityProvider.maxVCpuCount}

  extensions:
    AppLambdaFunction:
      Properties:
        CapacityProviderConfig:
          LambdaManagedInstancesCapacityProviderConfig:
            CapacityProviderArn:
              Fn::GetAtt: [LmiCapacityProvider, Arn]
            PerExecutionEnvironmentMaxConcurrency: ${self:custom.capacityProvider.perExecutionEnvironmentMaxConcurrency}

package:
  patterns:
    - src/**
    - '!node_modules/**'
